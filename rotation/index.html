<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <title>Video Rotation Test</title>

  <style>

    html, body {

      margin: 0;

      padding: 0;

      background-color: black;

      overflow: hidden;

      height: 100%;

      width: 100%;

    }

    .container {

      position: absolute;

      top: 50%;

      left: 50%;

      transform: translate(-50%, -50%);

      width: 100vh; /* vh because we're rotating */

      height: 100vw;

      display: flex;

      justify-content: center;

      align-items: center;

    }

    video {

      max-width: 100%;

      max-height: 100%;

      transform: rotate(90deg) scale(1);

      transform-origin: center center;

    }

  </style>

</head>

<body>

  <div class="container">

    <video autoplay loop muted playsinline>

      <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">

      Your browser does not support the video tag.

    </video>

  </div>

</body>

</html>
